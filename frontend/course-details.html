        // ═══════════════════════════════════════
        function renderCourse() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('course') || 'prompt-engineering';
            const course = COURSES[slug];

            // Read the language off the document (what i18n.js actually
            // applied), not off storage — storage is empty until the visitor
            // makes an explicit choice.
            const lang = window.currentLang ? window.currentLang() : 'ar';

            if (!course) {
                document.querySelector('.cd-info-area').innerHTML =
                    '<h1 class="cd-title">' + (lang === 'en' ? 'Course not found' : 'الكورس مش موجود') + '</h1>';
                return;
            }

            // Pick localized fields (falls back to Arabic when no English provided)
            const tr = (lang === 'en' && typeof COURSES_EN !== 'undefined' && COURSES_EN[slug]) ? COURSES_EN[slug] : null;
            const description = tr && tr.description ? tr.description : course.description;
            const beforeCourse = tr && tr.beforeCourse ? tr.beforeCourse : course.beforeCourse;
            const afterCourse = tr && tr.afterCourse ? tr.afterCourse : course.afterCourse;
            const videoWord = lang === 'en' ? 'videos' : 'فيديو';

            // Title tag
            document.title = `${course.title} — Ghawy`;

            // Hero image
            const heroImg = document.getElementById('cdHeroImg');
            heroImg.src = course.image;
            heroImg.alt = course.title;

            // Title
            document.getElementById('cdTitle').textContent = course.title;

            // Meta
            document.getElementById('cdMeta').innerHTML = `
                <span><i data-lucide="play-circle" class="nav-icon"></i> ${course.videoCount} ${videoWord}</span>
                <span class="cd-meta-dot">•</span>
                <span><i class="fa-regular fa-clock"></i> ${course.duration}</span>
            `;

            // Level
            document.getElementById('cdLevel').textContent = course.level;

            // Course name / Category tag (Replacing the old course title with category pill)
            document.getElementById('cdCourseName').innerHTML = `<span class="cd-category-tag">${course.category}</span>`;

            // Description
            document.getElementById('cdDescription').textContent = description;

            // Lessons sidebar
            const lessonsList = document.getElementById('cdLessonsList');
            lessonsList.innerHTML = course.lessons.map(l => `
                <li class="cd-lesson-item">
                    <span class="cd-lesson-title"><i data-lucide="play-circle" class="nav-icon"></i> ${l.title}</span>
                    <div class="cd-lesson-right">
                        <span class="cd-lesson-dur">${l.duration}</span>
                        <i class="fa-solid fa-lock cd-lesson-lock"></i>
                    </div>
                </li>
            `).join('');

            // Before & After
            const beforeList = document.getElementById('cdBeforeList');
            beforeList.innerHTML = beforeCourse.map(item => `
                <li>${item}</li>
            `).join('');

            const afterList = document.getElementById('cdAfterList');
            afterList.innerHTML = afterCourse.map(item => `
                <li>${item}</li>
            `).join('');
        }

        // ═══════════════════════════════════════
        //   Language
        // ═══════════════════════════════════════
        // The language engine is src/js/i18n.js (loaded at the bottom of this
        // page) — the same one every other page uses. This page used to carry
        // its own private copy of applyLanguage()/toggleLanguage(), which meant
        // a second, divergent language system on the site. All that is left
        // here is re-rendering the JS-built course content when the language
        // changes; i18n.js fires `languagechange` for exactly this.
        document.addEventListener('languagechange', () => {
            renderCourse();
            if (window.lucide) lucide.createIcons();
        });

        // First paint. i18n.js has already set <html lang/dir> by the time this
        // runs, so renderCourse() reads the right language.
        renderCourse();

        // ═══════════════════════════════════════
        //   Standard Page Setup
        // ═══════════════════════════════════════
        // Scroll reveal
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08 });
        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        // Auth state. The nav itself (logged-in vs logged-out, scroll state,
        // hamburger, drawer) is owned by layout.js; the only thing added here
        // is dropping a token the API has already rejected.
        (async function verifyToken() {
            const token = getToken();
            if (!token) return;
            try {
                const res = await fetch(`${API}/profile/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    GhawyLayout.updateNavAuth();
                }
            } catch (e) { /* offline — leave the nav as it is */ }
        })();
    </script>


    <script src="src/vendor/lucide/lucide.min.js?v=1270" onload="lucide.createIcons()"></script>
</body>
