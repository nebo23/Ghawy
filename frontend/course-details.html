<!DOCTYPE html>
<!-- Arabic-first like every other public page; i18n.js re-applies the
     visitor's stored choice on load. -->
<html lang="ar" dir="rtl" id="htmlRoot">

<head>
    <!-- CACHE BUSTER -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفاصيل الكورس — Ghawy</title>
    <link rel="icon" type="image/png" href="./imgs/community-logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="src/vendor/fontawesome/6.5.0/css/all.min.css?v=650" />
    <link rel="stylesheet" href="src/css/main.css?v=20260804b" />

</head>

<body>
    <!-- Shared navbar + drawer — single source in src/js/layout.js -->
    <div id="siteHeader"></div>
    <script src="src/js/layout.js?v=20260804"></script>

    <!-- ════════════════════════════════════════
     COURSE PREVIEW
     Everything on this page is rendered from src/js/catalog.js — the page
     used to carry its own private copy of all six courses (descriptions,
     lesson lists, before/after copy) which had already drifted from the
     platform. The long sales copy and the subscribe button are gone: this
     is a preview, and the track it belongs to is the onward link.
    ════════════════════════════════════════ -->
    <section class="cd-page">
        <div class="container">

            <a href="/courses" class="cd-back-btn">
                <i class="fa-solid fa-arrow-right cd-back-icon"></i>
                <span data-ar="كل الكورسات" data-en="All courses">كل الكورسات</span>
            </a>

            <div class="cd-head">
                <h1 class="cd-title" id="cdTitle"></h1>
                <!-- "ضمن مسار الاوتوميشن" → /tracks -->
                <div class="cd-trackline" id="cdTrack"></div>
            </div>

            <!-- Video and lesson list sit side by side. Which side the video
                 lands on is decided by the document direction alone: it is the
                 first child, so it takes the start edge — right in Arabic,
                 left in English — with no per-language CSS. -->
            <div class="cd-layout">
                <div class="cd-video-col" id="cdVideo"></div>

                <div class="cd-lessons-col">
                    <div class="cd-lessons-head">
                        <h2 class="cd-lessons-title" data-ar="محتوى الكورس" data-en="Course content">محتوى الكورس</h2>
                        <div class="cd-lessons-meta" id="cdMeta"></div>
                    </div>

                    <ul class="cd-lessons-list" id="cdLessonsList"></ul>

                    <p class="cd-locked-note">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <span data-ar="الدروس مقفولة — الاشتراك بيفتح كل الكورسات مع بعض."
                              data-en="Lessons are locked — one subscription opens every course.">الدروس مقفولة — الاشتراك بيفتح كل الكورسات مع بعض.</span>
                    </p>
                </div>
            </div>

            <!-- The instructor bar — same component as the course cards, in
                 its `full` variant. -->
            <div class="cd-instructor">
                <h2 class="cd-section-title" data-ar="مدرّب الكورس" data-en="Course instructor">مدرّب الكورس</h2>
                <div id="cdInstructor"></div>
            </div>

        </div>
    </section>

    <!-- Shared footer — single source in src/js/layout.js -->
    <div id="siteFooter"></div>
    <script>GhawyLayout.mountFooter();</script>

    <!-- Language engine — same file, same load position, as every other page.
         It must come before the inline script below, which renders the course
         content in whatever language i18n.js has just applied. -->
    <script src="src/js/i18n.js?v=20260804"></script>
    <!-- The single source for course + instructor data. -->
    <script src="src/js/catalog.js?v=20260804"></script>
    <script src="src/js/utils.js?v=20260804"></script>
    <script>
        // ═══════════════════════════════════════
        //   Render the course from the catalog
        // ═══════════════════════════════════════
        // No course data lives on this page any more. Titles, thumbnails,
        // durations, tracks and instructors all come from src/js/catalog.js,
        // and the lesson list comes from the public course endpoint through
        // it — so the lessons shown here are the ones actually published.
        const C = window.GhawyCatalog;

        function slugFromURL() {
            return new URLSearchParams(location.search).get('course') || '';
        }

        function notFound() {
            const t = { ar: 'الكورس ده مش موجود', en: 'This course does not exist' };
            const sub = {
                ar: 'يمكن اللينك قديم أو الكورس اتشال. شوف كل الكورسات المتاحة.',
                en: 'The link may be old, or the course was removed. Browse all available courses.'
            };
            document.getElementById('cdTitle').textContent = C.L(t);
            document.getElementById('cdTrack').innerHTML = '';
            document.querySelector('.cd-layout').innerHTML = `
                <div class="gc-empty">
                    <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
                    <p ${C.i18nAttrs(sub)}>${C.esc(C.L(sub))}</p>
                    <a class="gc-btn" href="/courses" data-ar="كل الكورسات" data-en="All courses">كل الكورسات</a>
                </div>`;
            document.querySelector('.cd-instructor').style.display = 'none';
        }

        function lessonRowHTML(l) {
            // NOTE: deliberately not `.lesson-row` — that class belongs to the
            // member course page and carries behaviour we do not want here.
            return `
            <li class="cd-lesson-item">
                <span class="cd-lesson-title">
                    <i class="fa-solid fa-circle-play" aria-hidden="true"></i>
                    ${C.esc(l.title)}
                </span>
                <span class="cd-lesson-right">
                    <span class="cd-lesson-dur">${C.esc(l.duration)}</span>
                    <i class="fa-solid fa-lock cd-lesson-lock" aria-hidden="true"></i>
                </span>
            </li>`;
        }

        function renderCourse() {
            const slug = slugFromURL();

            return C.courseBySlug(slug).then(course => {
                if (!course) { notFound(); return; }

                const title = C.L(course.title);
                document.title = `${title} — Ghawy`;
                document.getElementById('cdTitle').textContent = title;

                // Track line → /tracks
                const tr = C.track(course.track);
                const trackEl = document.getElementById('cdTrack');
                if (tr) {
                    const within = { ar: 'ضمن', en: 'Part of' };
                    trackEl.innerHTML = `
                        <span class="cd-track-pre" ${C.i18nAttrs(within)}>${C.esc(C.L(within))}</span>
                        <a class="cd-track-link" href="/tracks#${C.esc(tr.slug)}" ${C.i18nAttrs(tr.name)}>${C.esc(C.L(tr.name))}</a>`;
                } else {
                    trackEl.innerHTML = '';
                }

                // Intro video (placeholder until the client sends the files)
                document.getElementById('cdVideo').innerHTML = C.courseVideoHTML(course);

                // Lesson count + total duration
                const lessonsWord = {
                    ar: `${course.lessons} درس`,
                    en: `${course.lessons} lessons`,
                };
                document.getElementById('cdMeta').innerHTML = `
                    <span class="cd-meta-item">
                        <i class="fa-solid fa-list" aria-hidden="true"></i>
                        <span ${C.i18nAttrs(lessonsWord)}>${C.esc(C.L(lessonsWord))}</span>
                    </span>
                    <span class="cd-meta-item">
                        <i class="fa-regular fa-clock" aria-hidden="true"></i>
                        <span>${C.esc(course.duration)}</span>
                    </span>`;

                // Instructor bar — the shared component, full variant
                const inst = C.instructor(course.instructor);
                document.getElementById('cdInstructor').innerHTML = inst
                    ? C.instructorBarHTML(inst) + C.factsHTML(inst)
                    : '';

                // Lessons: skeleton rows until the endpoint answers.
                const list = document.getElementById('cdLessonsList');
                list.innerHTML = Array.from({ length: Math.min(course.lessons || 4, 8) },
                    () => '<li class="cd-lesson-item cd-lesson-skeleton"><span class="gc-sk gc-sk-line"></span></li>').join('');

                return C.lessonsFor(course).then(lessons => {
                    if (!lessons.length) {
                        // The endpoint failed or the course has no ready
                        // videos — say so rather than leaving grey bars.
                        const none = {
                            ar: 'قايمة الدروس مش متاحة دلوقتي.',
                            en: 'The lesson list is not available right now.'
                        };
                        list.innerHTML = `<li class="cd-lesson-none" ${C.i18nAttrs(none)}>${C.esc(C.L(none))}</li>`;
                        return;
                    }
                    list.innerHTML = lessons.map(lessonRowHTML).join('');
                });
            });
        }

        // ═══════════════════════════════════════
        //   Language
        // ═══════════════════════════════════════
        // The language engine is src/js/i18n.js (loaded above) — the same one
        // every other page uses. This page used to carry its own private copy
        // of applyLanguage()/toggleLanguage(), which meant a second, divergent
        // language system on the site. All that is left here is re-rendering
        // the JS-built content when the language changes; i18n.js fires
        // `languagechange` for exactly this.
        document.addEventListener('languagechange', renderCourse);

        // First paint. i18n.js has already set <html lang/dir> by the time
        // this runs, so renderCourse() reads the right language.
        renderCourse();

        // ═══════════════════════════════════════
        //   Standard Page Setup
        // ═══════════════════════════════════════
        // Auth state. The nav itself (logged-in vs logged-out, scroll state,
        // hamburger, drawer) is owned by layout.js; the only thing added here
        // is dropping a token the API has already rejected.
        (async function verifyToken() {
            const token = getToken();
            if (!token) return;
            try {
                const res = await fetch(`${API}/profile/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    GhawyLayout.updateNavAuth();
                }
            } catch (e) { /* offline — leave the nav as it is */ }
        })();
    </script>
</body>

</html>
