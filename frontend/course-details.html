<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <!-- CACHE BUSTER -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap"

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="src/css/main.css" />
    
</head>

<body>
    <!-- ════════════════════════════════════════
     HEADER / NAV
    ════════════════════════════════════════ -->
    <nav class="main-nav" id="mainNav">
        <a href="index.html" class="nav-logo">
            <img src="./imgs/ghawi-logo.png" alt="Ghawi" />
        </a>
        <ul class="nav-links">
            <li><a href="index.html#features">المميزات</a></li>
            <li><a href="index.html#reviews">الاراء</a></li>
            <li><a href="index.html#modules">الكورسات</a></li>
            <li><a href="index.html#payment">السعر</a></li>
        </ul>
        <div class="nav-auth" id="navLoggedOut">
            <button class="nav-auth-btn ghost" onclick="window.location.href='login.html'">تسجيل الدخول</button>
            <button class="nav-auth-btn primary" onclick="window.location.href='index.html#payment'">ابدأ الآن</button>
        </div>
        <div class="nav-auth" id="navLoggedIn" style="display:none; align-items:center; gap:12px;">
            <button class="nav-auth-btn danger" onclick="logout()">تسجيل الخروج</button>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="القائمة">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div class="mobile-drawer" id="mobileDrawer">
        <button class="close-drawer" onclick="closeDrawer()">✕</button>
        <div class="drawer-links">
            <a href="index.html#features" onclick="closeDrawer()">المميزات</a>
            <a href="index.html#reviews" onclick="closeDrawer()">الاراء</a>
            <a href="index.html#modules" onclick="closeDrawer()">الكورسات</a>
            <a href="index.html#payment" onclick="closeDrawer()">السعر</a>
        </div>
        <div class="drawer-auth" id="mobileAuthLoggedOut">
            <a href="login.html" class="nav-login">تسجيل الدخول</a>
            <a href="#payment" class="nav-signup btn-glow" onclick="closeDrawer()">ابدأ الآن</a>
        </div>
        <div class="drawer-auth" id="mobileAuthLoggedIn" style="display: none">
            <button class="nav-login danger" onclick="logout(); closeDrawer();">تسجيل الخروج</button>
        </div>
    </div>

    <!-- ════════════════════════════════════════
     COURSE DETAILS CONTENT
    ════════════════════════════════════════ -->
    <section class="course-details-section">
        <div class="container">

            <!-- Back Button -->
            <a href="index.html#modules" class="cd-back-btn">
                <i class="fa-solid fa-arrow-right"></i> العودة للكورسات
            </a>

            <!-- Course Header Info (above the grid) -->
            <div class="cd-info-area reveal">
                <h1 class="cd-title" id="cdTitle"></h1>

                <div class="cd-meta-row" id="cdMeta"></div>

                <div class="cd-level-badge">
                    <span class="cd-level-dot"></span> <span id="cdLevel"></span>
                </div>

                <div class="cd-course-name" id="cdCourseName"></div>
            </div>

            <!-- MAIN ROW: Video + Sidebar -->
            <div class="cd-layout">

                <!-- RIGHT: Video Thumbnail -->
                <div class="cd-video-area reveal">
                    <div class="cd-video-thumb">
                        <img id="cdHeroImg" src="" alt=""
                            style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0;" />
                        <div class="cd-play-overlay">
                            <i class="fa-solid fa-circle-play"></i>
                        </div>
                        <div class="cd-video-gradient"></div>
                    </div>
                    <p class="cd-description" id="cdDescription" style="margin-top: 24px; padding: 0 10px;"></p>
                </div>

                <!-- LEFT: Sidebar -->
                <div class="cd-sidebar reveal" style="animation-delay: 0.2s;">
                    <h3><i class="fa-solid fa-list"></i> محتويات الكورس</h3>

                    <ul class="cd-lessons-list" id="cdLessonsList">
                        <!-- Dynamically populated -->
                    </ul>

                    <p class="cd-sidebar-note">اشترك للوصول لجميع الفيديوهات</p>

                    <a href="index.html#payment" class="btn-cta cd-subscribe-btn">
                        اشترك الآن
                    </a>
                </div>

            </div>

            <!-- What you'll learn -->
            <div class="cd-learn-area reveal">
                <h3 class="cd-learn-title">هتتعلم إيه في الكورس؟</h3>
                <ul class="cd-learn-list" id="cdLearnList">
                    <!-- Dynamically populated -->
                </ul>
            </div>

        </div>
    </section>

    <!-- ════════════════════════════════════════
     FOOTER
    ════════════════════════════════════════ -->
    <footer style="margin-top: 40px;">
        <div class="container"
            style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;">
            <img src="./imgs/ghawi-logo.png" alt="Ghawy Logo" style="height: 40px; width: auto;" />
            <p style="margin-bottom: 10px; font-size: 0.8rem; color: var(--muted);">
                © 2026 Ghawy. جميع الحقوق محفوظة.
            </p>
        </div>
    </footer>

    <script src="src/js/utils.js"></script>
    <script src="src/js/main.js"></script>

        // ═══════════════════════════════════════
        //   Render Course Details
        // ═══════════════════════════════════════
        function renderCourse() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('course') || 'ai-automation-lab';
            const course = COURSES[slug];

            if (!course) {
                document.querySelector('.cd-info-area').innerHTML = '<h1 class="cd-title">الكورس مش موجود</h1>';
                return;
            }

            // Title tag
            document.title = `${course.title} — Ghawy`;

            // Hero image
            const heroImg = document.getElementById('cdHeroImg');
            heroImg.src = course.image;
            heroImg.alt = course.title;

            // Title
            document.getElementById('cdTitle').textContent = course.title;

            // Meta
            document.getElementById('cdMeta').innerHTML = `
                <span><i data-lucide="play-circle" class="nav-icon"></i> ${course.videoCount} فيديو</span>
                <span class="cd-meta-dot">•</span>
                <span><i class="fa-regular fa-clock"></i> ${course.duration}</span>
                <span class="cd-meta-dot">•</span>
                <span class="cd-category-tag">${course.category}</span>
            `;

            // Level
            document.getElementById('cdLevel').textContent = course.level;

            // Course name
            document.getElementById('cdCourseName').innerHTML = `<i data-lucide="presentation" class="nav-icon"></i> ${course.title}`;

            // Description
            document.getElementById('cdDescription').textContent = course.description;

            // Lessons sidebar
            const lessonsList = document.getElementById('cdLessonsList');
            lessonsList.innerHTML = course.lessons.map(l => `
                <li class="cd-lesson-item">
                    <span class="cd-lesson-title"><i data-lucide="play-circle" class="nav-icon"></i> ${l.title}</span>
                    <div class="cd-lesson-right">
                        <span class="cd-lesson-dur">${l.duration}</span>
                        <i class="fa-solid fa-lock cd-lesson-lock"></i>
                    </div>
                </li>
            `).join('');

            // Learnings
            const learnList = document.getElementById('cdLearnList');
            learnList.innerHTML = course.learnings.map(l => `
                <li><i data-lucide="check" size="16"></i> ${l}</li>
            `).join('');
        }

        renderCourse();

        // ═══════════════════════════════════════
        //   Standard Page Setup
        // ═══════════════════════════════════════
        // Scroll reveal
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08 });
        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        // Auth state
        function updateAuthUI() {
            const token = getToken();
            const out = document.getElementById('navLoggedOut');
            const inn = document.getElementById('navLoggedIn');
            if (token) {
                if (out) out.style.display = 'none';
                if (inn) inn.style.display = 'flex';
            } else {
                if (out) out.style.display = '';
                if (inn) inn.style.display = 'none';
            }
        }
        updateAuthUI();

        // Scroll-aware nav
        const mainNav = document.getElementById('mainNav');
        if (mainNav) {
            window.addEventListener('scroll', () => {
                mainNav.classList.toggle('scrolled', window.scrollY > 60);
            }, { passive: true });
        }

        // Hamburger
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileDrawer = document.getElementById('mobileDrawer');
        function closeDrawer() {
            if (hamburgerBtn) hamburgerBtn.classList.remove('active');
            if (mobileDrawer) mobileDrawer.classList.remove('open');
            document.body.style.overflow = '';
        }
        if (hamburgerBtn) {
            hamburgerBtn.addEventListener('click', () => {
                hamburgerBtn.classList.toggle('active');
                mobileDrawer.classList.toggle('open');
                document.body.style.overflow = mobileDrawer.classList.contains('open') ? 'hidden' : '';
            });
        }
    </script>


<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" onload="lucide.createIcons()"></script>
</body>

</html>
