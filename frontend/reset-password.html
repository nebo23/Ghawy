    <title data-i18n="resetPageTitle">إعادة تعيين كلمة المرور — Ghawy</title>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WNSQXRZL"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    </nav>

    <!-- One card, three steps. The member never leaves the page: the code is
         traded for a short-lived token at step 2, so it is out of the way by the
         time they are choosing a password at step 3. -->
    <div class="card cyan">
        <h1 class="card-title" data-i18n="resetTitle" data-i18n-html="true">إعادة تعيين <span class="cyan">كلمة المرور</span></h1>
        <div id="alert" class="alert"></div>

        <!-- ── Step 1: email ── -->
        <div id="stepEmail">
            <p class="card-sub" data-i18n="resetEmailSub">اكتب إيميلك وهنبعتلك كود مكوّن من 6 أرقام.</p>
            <div class="field">
                <label data-i18n="email">البريد الإلكتروني</label>
                <input type="email" id="email" data-i18n-placeholder="emailPlaceholder" placeholder="example@gmail.com"
                    dir="ltr" class="cyan-focus" />
            </div>
            <button class="btn" id="sendCodeBtn" onclick="sendResetCode()">
                <span class="btn-text" data-i18n="sendCode">إرسال الكود</span>
                <div class="spinner"></div>
            </button>
        </div>

        <!-- ── Step 2: the code ── -->
        <div id="stepCode" style="display:none;">
            <p class="card-sub">
                <span data-i18n="enterOtp">أدخل الكود المكوّن من 6 أرقام الذي تم إرساله إلى:</span>
                <span id="emailHint" class="email-hint"></span>
            </p>
            <div class="otp-group" dir="ltr">
                <input class="otp-input cyan-focus" id="code0" type="text" inputmode="numeric" maxlength="1"
                    autocomplete="one-time-code" />
                <input class="otp-input cyan-focus" id="code1" type="text" inputmode="numeric" maxlength="1" />
                <input class="otp-input cyan-focus" id="code2" type="text" inputmode="numeric" maxlength="1" />
                <input class="otp-input cyan-focus" id="code3" type="text" inputmode="numeric" maxlength="1" />
                <input class="otp-input cyan-focus" id="code4" type="text" inputmode="numeric" maxlength="1" />
                <input class="otp-input cyan-focus" id="code5" type="text" inputmode="numeric" maxlength="1" />
            </div>
            <button class="btn" id="verifyCodeBtn" onclick="verifyResetCode()">
                <span class="btn-text" data-i18n="verify">تحقق</span>
                <div class="spinner"></div>
            </button>
            <div class="resend-row">
                <button id="resendBtn" class="link-btn" onclick="resendResetCode()" disabled
                    data-i18n="resendCode">إعادة إرسال الكود</button>
                <span id="resendTimer" class="muted-text">إعادة الإرسال خلال 60ث</span>
            </div>
        </div>

        <!-- ── Step 3: the new password ── -->
        <div id="stepPassword" style="display:none;">
            <p class="card-sub" data-i18n="resetChooseSub">اختار كلمة مرور جديدة (6 حروف على الأقل).</p>
            <div class="field">
                <label data-i18n="newPassword">كلمة المرور الجديدة</label>
                <!-- dir="ltr" on the WRAPPER is load-bearing, not decoration.
                     The input is forced dir="ltr" (passwords are Latin), so its
                     `padding-inline-start: 40px` reserves space on the LEFT. Without a
                     direction here the wrapper inherits the page's, so in Arabic the
                     button's `inset-inline-start` resolved to the RIGHT — the gap was
                     left empty and the eye sat directly on top of the password dots.
                     One direction for both, and the two agree in either language. -->
                <div style="position: relative;" dir="ltr">
                    <input type="password" id="password" data-i18n-placeholder="passwordPlaceholder"
                        placeholder="••••••••" dir="ltr" class="cyan-focus"
                        style="padding-inline-start: 40px; width: 100%; box-sizing: border-box;" />
                    <button type="button" onclick="togglePassword('password', 'toggleIcon1')"
                        style="position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;"
                        tabindex="-1" data-i18n-title="showPassword" title="إظهار كلمة المرور">
                        <span id="toggleIcon1" style="display: flex; align-items: center; justify-content: center;"><i
                                data-lucide="eye" style="width: 20px; height: 20px;"></i></span>
                    </button>
                </div>
            </div>
            <div class="field">
                <label data-i18n="confirmPassword">تأكيد كلمة المرور</label>
                <div style="position: relative;" dir="ltr">
                    <input type="password" id="passwordConfirm" data-i18n-placeholder="passwordPlaceholder"
                        placeholder="••••••••" dir="ltr" class="cyan-focus"
                        style="padding-inline-start: 40px; width: 100%; box-sizing: border-box;" />
                    <button type="button" onclick="togglePassword('passwordConfirm', 'toggleIcon2')"
                        style="position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;"
                        tabindex="-1" data-i18n-title="showPassword" title="إظهار كلمة المرور">
                        <span id="toggleIcon2" style="display: flex; align-items: center; justify-content: center;"><i
                                data-lucide="eye" style="width: 20px; height: 20px;"></i></span>
                    </button>
                </div>
            </div>
            <button class="btn" id="resetBtn" onclick="submitNewPassword()">
                <span class="btn-text" data-i18n="saveNewPassword">حفظ كلمة المرور</span>
                <div class="spinner"></div>
            </button>
        </div>

        <div class="bottom-link">
            <span data-i18n="rememberedPassword">فاكر كلمة المرور؟</span> <a href="login.html" data-i18n="login">دخول</a>
        </div>
    </div>

    <script src="src/js/campaign-type.js?v=20260906a"></script>
    <script src="src/js/utils.js?v=20260905b"></script>
    <script src="src/js/i18n.js?v=20260828a"></script>
    <script src="src/js/reset-password.js?v=20260828a"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => window.lucide && window.lucide.createIcons());

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const iconContainer = document.getElementById(iconId);
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            iconContainer.innerHTML = `<i data-lucide="${showing ? 'eye' : 'eye-off'}" style="width: 20px; height: 20px;"></i>`;
            window.lucide && window.lucide.createIcons();
        }
    </script>
