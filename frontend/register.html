<html lang="ar" dir="rtl">

<head>

  <!-- CACHE BUSTER -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="registerPageTitle">إنشاء حساب — Ghawy</title>
  <link rel="icon" type="image/png" href="./imgs/community-logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="src/vendor/fontawesome/6.5.0/css/all.min.css?v=650" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#AAFF00',
            darkbg: '#0a0a0a',
            inputbg: '#1a1a1a',
          },
          fontFamily: {
            sans: ['Cairo', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #0a0a0a;
      color: white;
      font-family: 'Cairo', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* the page must never scroll sideways — the captcha widget is the usual culprit */
      overflow-x: hidden;
    }

    html[lang="en"] body {
      font-family: 'Inter', sans-serif;
    }

    .input-field {
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: white;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: #AAFF00;
    }

    .input-icon {
      color: #888;
    }

    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background-color: #333;
      transition: all 0.3s ease;
    }

    .strength-bar.active.weak {
      background-color: #ef4444;
    }

    .strength-bar.active.medium {
      background-color: #eab308;
    }

    .strength-bar.active.strong {
      background-color: #AAFF00;
    }

    .check-item {
      color: #666;
      transition: color 0.2s;
    }

    .check-item.valid {
      color: #AAFF00;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .invite-welcome {
      background: rgba(63, 143, 249, 0.08);
      border: 1px solid rgba(63, 143, 249, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    /* First / last name: side by side on desktop, stacked on mobile */
    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .name-row {
        grid-template-columns: 1fr;
      }
    }

    /* ── Cloudflare Turnstile ──────────────────────────────────
       The widget renders in a fixed-width iframe, so it used to sit on the page
       looking like a pasted-in foreign element. Wrap it in the same dark card
       styling as the inputs and clamp it to the form width. */
    .turnstile-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 0.75rem;
      /* same as the inputs' rounded-xl */
      padding: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .turnstile-wrap .cf-turnstile {
      display: flex;
      justify-content: center;
      margin: 0 auto;
    }

    /* The widget is ~300px wide. On narrow phones scale it down instead of
       letting it push the page into a horizontal scroll. */
    @media (max-width: 400px) {
      .turnstile-wrap .cf-turnstile {
        transform: scale(0.88);
        transform-origin: center center;
      }
    }

    @media (max-width: 340px) {
      .turnstile-wrap .cf-turnstile {
        transform: scale(0.78);
      }
    }

    /* Language toggle — same look as the landing page button */
    .lang-toggle {
      position: fixed;
      top: 20px;
      inset-inline-end: 20px;
      z-index: 30;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s;
    }

    .lang-toggle:hover {
      border-color: #3f8ff9;
      color: #3f8ff9;
    }
  </style>
  <script src="src/vendor/lucide/lucide.min.js?v=1270"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WNSQXRZL"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
  <!-- Language toggle -->
  <button class="lang-toggle" id="langToggleBtn" onclick="toggleLanguage()">
    <i class="fa-solid fa-globe" style="margin-inline-end: 6px;"></i>
    <span id="langToggleText">English</span>
  </button>

  <div class="w-full max-w-md p-6 mx-auto">
    <!-- Logo -->
    <div class="flex justify-center mb-2 relative">
      <div class="absolute start-0 top-0">
      </div>
      <img src="./imgs/g-icon-logo.png" alt="Ghawy Logo" class="h-32 object-contain">
    </div>

    <!-- Header -->
    <div class="text-center mb-8" id="default-header">
      <h1 class="text-2xl font-bold mb-2" data-i18n="register">إنشاء حساب</h1>
      <p class="text-gray-400 text-sm" data-i18n="createAccountSub">سجّل الآن وابدأ رحلتك مع الـ AI</p>
    </div>

    <!-- Invite Header (hidden by default) -->
    <div class="text-center mb-8" id="invite-header" style="display: none;">
      <h1 class="text-2xl font-bold mb-2 text-[#3f8ff9]" data-i18n="setYourPassword">اختار كلمة المرور</h1>
      <p class="text-gray-400 text-sm" data-i18n="setYourPasswordSub">أهلاً بيك تاني! اختار كلمة مرور عشان تكمّل حسابك.
      </p>
    </div>

    <div id="formAlert" class="hidden mb-4 p-3 rounded text-sm text-center"></div>

    <form id="registerForm" onsubmit="event.preventDefault(); submitRegister();">
      <!-- Hidden fields -->
      <input type="hidden" id="country" name="country">
      <input type="hidden" id="governorate" name="governorate">

      <!-- Name (first + last) -->
      <div class="mb-4 name-row" id="name-section">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1" data-i18n="firstName">الاسم الأول</label>
          <div class="relative">
            <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none">
              <i class="fa-regular fa-user input-icon"></i>
            </div>
            <input type="text" id="firstName" data-i18n-placeholder="firstNamePlaceholder" placeholder="مثلا: محمد"
              class="input-field w-full ps-10 pe-4 py-3 rounded-xl text-sm" required>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1" data-i18n="lastName">الاسم الأخير</label>
          <div class="relative">
            <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none">
              <i class="fa-regular fa-user input-icon"></i>
            </div>
            <input type="text" id="lastName" data-i18n-placeholder="lastNamePlaceholder" placeholder="مثلا: احمد"
              class="input-field w-full ps-10 pe-4 py-3 rounded-xl text-sm" required>
          </div>
        </div>
      </div>

      <!-- Email Address -->
      <div class="mb-4">
        <label class="block text-xs font-medium text-gray-400 mb-1" data-i18n="emailAddress">البريد الإلكتروني</label>
        <div class="relative">
          <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none">
            <i class="fa-regular fa-envelope input-icon"></i>
          </div>
          <input type="email" id="email" dir="ltr" data-i18n-placeholder="emailAddressPlaceholder"
            placeholder="اكتب بريدك الإلكتروني" class="input-field w-full ps-10 pe-4 py-3 rounded-xl text-sm" required>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label id="password-label" class="block text-xs font-medium text-gray-400 mb-1" data-i18n="password">كلمة
          المرور</label>
        <div class="relative mb-2">
          <div class="absolute inset-y-0 start-0 ps-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-lock input-icon"></i>
          </div>
          <input type="password" id="password" dir="ltr" data-i18n-placeholder="passwordCreatePlaceholder"
            placeholder="اختر كلمة مرور قوية" class="input-field w-full ps-10 pe-10 py-3 rounded-xl text-sm" required>
          <div class="absolute inset-y-0 end-0 pe-3 flex items-center cursor-pointer"
            onclick="togglePasswordVisibility()">
            <i id="toggleIcon" class="fa-regular fa-eye-slash text-gray-400 hover:text-white transition-colors"></i>
          </div>
        </div>

        <!-- Password Strength -->
        <div class="flex items-center gap-1 mb-3">
          <div class="text-[10px] text-gray-400 w-24" data-i18n="passwordStrength">قوة كلمة المرور:</div>
          <div class="flex-1 flex gap-1">
            <div id="bar1" class="strength-bar flex-1"></div>
            <div id="bar2" class="strength-bar flex-1"></div>
            <div id="bar3" class="strength-bar flex-1"></div>
            <div id="bar4" class="strength-bar flex-1"></div>
          </div>
          <div id="strengthText" class="text-[10px] font-medium w-12 text-end text-gray-500"></div>
        </div>

        <!-- Checkmarks -->
        <div class="space-y-1">
          <div id="checkLength" class="check-item flex items-center text-xs">
            <i class="fa-regular fa-circle-check me-2"></i> <span data-i18n="checkLength">8 حروف على الأقل</span>
          </div>
          <div id="checkCase" class="check-item flex items-center text-xs">
            <i class="fa-regular fa-circle-check me-2"></i> <span data-i18n="checkCase">حروف كبيرة وصغيرة</span>
          </div>
          <div id="checkNumber" class="check-item flex items-center text-xs">
            <i class="fa-regular fa-circle-check me-2"></i> <span data-i18n="checkNumber">رقم أو رمز خاص</span>
          </div>

          <div class="mt-4 pt-2">
            <label class="flex items-center text-xs text-gray-400">
              <input type="checkbox" id="terms"
                class="me-2 rounded border-gray-700 bg-[#1a1a1a] text-brand focus:ring-brand w-4 h-4 cursor-pointer"
                required>
              <span data-i18n="agreeTerms" data-i18n-html="true">أوافق على <a href="terms.html" target="_blank"
                  class="text-brand hover:underline mx-1"><u>الشروط والأحكام</u></a> و<a href="privacy.html"
                  target="_blank" class="text-brand hover:underline mx-1"><u>سياسة الخصوصية</u></a></span>
            </label>
          </div>
        </div>
      </div>

      <!-- "I'm not a robot" — Cloudflare Turnstile. The matching SECRET key
           lives in backend/.env.production as TURNSTILE_SECRET_KEY. -->
      <div class="turnstile-wrap">
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAD6kttxI3Je2SKjB"
             data-theme="dark"
             data-callback="onTurnstileSuccess"
             data-expired-callback="onTurnstileExpired"
             data-error-callback="onTurnstileExpired"></div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitRegBtn"
        class="w-full bg-brand hover:bg-[#99e600] text-black font-bold py-3 rounded-full transition-colors flex justify-center items-center relative disabled:opacity-70 disabled:cursor-not-allowed"
        disabled>
        <span class="transition-opacity duration-200" data-i18n="signUpNow" data-i18n-html="true">إنشاء الحساب <i
            class="fa-solid fa-arrow-left" style="margin-inline-start:6px"></i></span>
        <div id="spinner"
          class="hidden absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 flex justify-center items-center">
          <svg class="animate-spin h-6 w-6 text-black" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
        </div>
      </button>

      <!-- Divider -->
      <div id="social-divider" class="flex items-center my-6">
        <div class="flex-grow border-t border-gray-800"></div>
        <span class="px-4 text-xs text-gray-500 font-medium" data-i18n="orDividerCaps">أو</span>
        <div class="flex-grow border-t border-gray-800"></div>
      </div>

      <!-- Google Button -->
      <button type="button" id="google-btn" onclick="googleSignIn()"
        class="w-full bg-transparent border border-gray-800 hover:bg-[#1a1a1a] text-white font-medium py-3 rounded-full transition-colors flex justify-center items-center gap-2">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        <span data-i18n="googleSignUp">التسجيل باستخدام جوجل</span>
      </button>

    </form>

    <div id="login-footer" class="mt-6 text-center text-xs text-gray-500">
      <span data-i18n="alreadyHaveAccount">عندك حساب بالفعل؟</span> <a href="login.html"
        class="text-white font-medium hover:text-brand transition-colors" data-i18n="loginNow">سجّل دخولك</a>
    </div>
  </div>

  <script src="src/js/utils.js?v=1786000000"></script>
  <script src="src/js/i18n.js?v=20260818a"></script>
  <script src="src/js/register.js?v=20260804"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => window.lucide && window.lucide.createIcons());
  </script>
</body>

</html>
