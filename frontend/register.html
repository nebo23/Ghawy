<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <!-- CACHE BUSTER -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — Ghawy</title>
  <link rel="icon" type="image/png" href="./imgs/ghawy-new-logo-transparent.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#AAFF00',
            darkbg: '#0a0a0a',
            inputbg: '#1a1a1a',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0a0a0a;
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-field {
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: white;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: #AAFF00;
    }

    .input-icon {
      color: #888;
    }

    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background-color: #333;
      transition: all 0.3s ease;
    }

    .strength-bar.active.weak {
      background-color: #ef4444;
    }

    .strength-bar.active.medium {
      background-color: #eab308;
    }

    .strength-bar.active.strong {
      background-color: #AAFF00;
    }

    .check-item {
      color: #666;
      transition: color 0.2s;
    }

    .check-item.valid {
      color: #AAFF00;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>
  <div class="w-full max-w-md p-6 mx-auto">
    <!-- Logo -->
    <div class="flex justify-center mb-6 relative">
      <div class="absolute left-0 top-0">
      </div>
      <img src="./imgs/g-icon-logo.png" alt="Ghawy Logo" class="h-12 object-contain">
    </div>

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold mb-2" data-i18n="register">إنشاء حساب</h1>
      <p class="text-gray-400 text-sm" data-i18n="createAccountSub">سجّل الآن وابدأ رحلتك مع الـ AI</p>
    </div>

    <div id="formAlert" class="hidden mb-4 p-3 rounded text-sm text-center"></div>

    <form id="registerForm" onsubmit="event.preventDefault(); submitRegister();">
      <!-- Hidden fields -->
      <input type="hidden" id="country" name="country">
      <input type="hidden" id="governorate" name="governorate">

      <!-- Full Name -->
      <div class="mb-4">
        <label class="block text-xs font-medium text-gray-400 mb-1">Full Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-regular fa-user input-icon"></i>
          </div>
          <input type="text" id="fullName" placeholder="Enter your full name"
            class="input-field w-full pl-10 pr-4 py-3 rounded-xl text-sm" required>
        </div>
      </div>

      <!-- Email Address -->
      <div class="mb-4">
        <label class="block text-xs font-medium text-gray-400 mb-1">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-regular fa-envelope input-icon"></i>
          </div>
          <input type="email" id="email" placeholder="Enter your email address"
            class="input-field w-full pl-10 pr-4 py-3 rounded-xl text-sm" required>
        </div>
      </div>

      <!-- Phone Number -->
      <div class="mb-4">
        <label class="block text-xs font-medium text-gray-400 mb-1">Phone Number</label>
        <div class="flex">
          <div class="input-field flex items-center px-3 rounded-l-xl border-r-0 text-sm w-24 justify-center bg-[#111]">
            <span id="countryFlag" class="mr-2">🌍</span>
            <span id="dialCode" class="text-gray-300">---</span>
          </div>
          <input type="tel" id="phone" placeholder="Enter your phone number"
            class="input-field w-full px-4 py-3 rounded-r-xl text-sm border-l-0" required
            oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
        <div class="relative mb-2">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-lock input-icon"></i>
          </div>
          <input type="password" id="password" placeholder="Create a strong password"
            class="input-field w-full pl-10 pr-10 py-3 rounded-xl text-sm" required>
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer"
            onclick="togglePasswordVisibility()">
            <i id="toggleIcon" class="fa-regular fa-eye-slash text-gray-400 hover:text-white transition-colors"></i>
          </div>
        </div>

        <!-- Password Strength -->
        <div class="flex items-center gap-1 mb-3">
          <div class="text-[10px] text-gray-400 w-24">Password Strength:</div>
          <div class="flex-1 flex gap-1">
            <div id="bar1" class="strength-bar flex-1"></div>
            <div id="bar2" class="strength-bar flex-1"></div>
            <div id="bar3" class="strength-bar flex-1"></div>
            <div id="bar4" class="strength-bar flex-1"></div>
          </div>
          <div id="strengthText" class="text-[10px] font-medium w-12 text-right text-gray-500"></div>
        </div>

        <!-- Checkmarks -->
        <div class="space-y-1">
          <div id="checkLength" class="check-item flex items-center text-xs">
            <i class="fa-regular fa-circle-check mr-2"></i> At least 8 characters
          </div>
          <div id="checkCase" class="check-item flex items-center text-xs">
            <i class="fa-regular fa-circle-check mr-2"></i> Contains uppercase and lowercase letters
          </div>
          <div id="checkNumber" class="check-item flex items-center text-xs">
            <i class="fa-regular fa-circle-check mr-2"></i> Contains number or special character
          </div>
          
          <div class="mt-4 pt-2">
            <label class="flex items-center text-xs text-gray-400">
              <input type="checkbox" id="terms" class="mr-2 rounded border-gray-700 bg-[#1a1a1a] text-brand focus:ring-brand w-4 h-4 cursor-pointer" required>
              I agree to the <a href="#" class="text-brand hover:underline ml-1"><u>Terms and Conditions</u></a>.
            </label>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitRegBtn"
        class="w-full bg-brand hover:bg-[#99e600] text-black font-bold py-3 rounded-full transition-colors flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
        disabled>
        <span>Sign Up Now <i class="fa-solid fa-arrow-right ml-1"></i></span>
        <div id="spinner" class="hidden w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin">
        </div>
      </button>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-grow border-t border-gray-800"></div>
        <span class="px-4 text-xs text-gray-500 font-medium">OR</span>
        <div class="flex-grow border-t border-gray-800"></div>
      </div>

      <!-- Google Button -->
      <button type="button" onclick="googleSignIn()"
        class="w-full bg-transparent border border-gray-800 hover:bg-[#1a1a1a] text-white font-medium py-3 rounded-full transition-colors flex justify-center items-center gap-2">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Sign in with Google
      </button>

    </form>

    <div class="mt-6 text-center text-xs text-gray-500">
      <span data-i18n="alreadyHaveAccount">عندك حساب بالفعل؟</span> <a href="login.html"
        class="text-white font-medium hover:text-brand transition-colors" data-i18n="loginNow">سجّل دخولك</a>
    </div>
  </div>

  <script src="src/js/utils.js"></script>
  <script src="src/js/i18n.js"></script>
  <script src="src/js/register.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
</script>
</body>

</html>
