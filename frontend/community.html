<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guest of Honors — Ghawy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="./imgs/ghawi-logo.png" />
    <link rel="stylesheet" href="src/css/dashboard.css" />
</head>

<body>
    <div class="dash-layout">
        <!-- SIDEBAR -->
        <aside class="dash-sidebar" id="dashSidebar">
            <div class="sidebar-logo">
                <img src="./imgs/ghawi-logo.png" alt="Ghawy" />
                <span>Ghawy</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html?v=2" class="nav-item"><i class="fa-solid fa-house"></i> <span data-i18n="dashboard">الرئيسية</span></a>
                <a href="courses.html?v=2" class="nav-item"><i class="fa-solid fa-graduation-cap"></i> <span data-i18n="courses">الكورسات</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-video"></i> <span data-i18n="buildWithMe">???? ????? (????)</span></a>
                <a href="community.html?v=2" class="nav-item active"><i class="fa-solid fa-star"></i> <span data-i18n="guestOfHonors">ضيوف الشرف</span></a>
                <a href="chat.html?v=2" class="nav-item"><i class="fa-solid fa-comments"></i> <span data-i18n="communityChat">شات المجتمع</span></a>
                <a href="profile.html#achievements" class="nav-item"><i class="fa-solid fa-trophy"></i> <span data-i18n="achievements">الإنجازات</span></a>
                <a href="profile-settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> <span data-i18n="settings">الإعدادات</span></a>
            </nav>
            <div class="sidebar-user" id="sidebarUser">
                <div class="sidebar-user-avatar" id="sidebarAvatar"><i class="fa-solid fa-user"></i></div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="sidebarName">—</div>
                    <div class="sidebar-user-badge" id="sidebarBadge" data-i18n="member">عضو</div>
                </div>
            </div>
            <div class="sidebar-streak" id="sidebarStreak">
                <span class="streak-fire">🔥</span>
                <span><span class="streak-count" id="streakCount">0</span> <span data-i18n="daysStreak">يوم متواصل</span></span>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- MAIN -->
        <div class="dash-main">
            <!-- TOPBAR -->
            <header class="dash-topbar">
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="topbar-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="بحث..." />
                </div>
                <div class="topbar-actions">
                    <button class="topbar-icon"><i class="fa-solid fa-bell"></i><span class="notif-dot"></span></button>
                    <a href="chat.html?v=2" class="topbar-icon"><i class="fa-solid fa-message"></i></a>
                    <div class="topbar-user" id="topbarUser" onclick="document.getElementById('userDropdown').classList.toggle('open')">
                        <div class="topbar-user-avatar" id="topbarAvatar"><i class="fa-solid fa-user"></i></div>
                        <span class="topbar-user-name" id="topbarName">—</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="profile.html"><i class="fa-solid fa-user"></i> الملف الشخصي</a>
                        <a href="profile-settings.html"><i class="fa-solid fa-gear"></i> الإعدادات</a>
                        <button class="dd-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
                    </div>
                </div>
            </header>

            <!-- CONTENT -->
            <div class="dash-content" style="display:flex; align-items:center; justify-content:center; height:calc(100vh - 56px);">
            </div>
        </div>
    </div>

    <script>document.addEventListener('click',e=>{const d=document.getElementById('userDropdown');const u=document.getElementById('topbarUser');if(d&&!d.contains(e.target)&&!u.contains(e.target))d.classList.remove('open')})</script>
    <script src="src/js/utils.js"></script>
    <script>
        // Auth guard
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        const headers = { 'Authorization': 'Bearer ' + token };
        // Load user info
        (async function() {
            try {
                const res = await fetch(API + '/profile/me', { headers });
                if (!res.ok) return;
                const u = await res.json();
                const setTxt = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
                setTxt('sidebarName', u.full_name);
                setTxt('topbarName', u.full_name);
                setTxt('sidebarBadge', u.badge || 'Member');
                setTxt('streakCount', u.streak_days || 0);
                ['sidebarAvatar', 'topbarAvatar'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el && u.avatar_url) el.innerHTML = '<img src="' + u.avatar_url + '" alt=""/>';
                });
            } catch(e) {}
        })();
        function logout() { localStorage.removeItem('token'); window.location.href = 'login.html'; }
        // Hamburger
        const hb = document.getElementById('hamburgerBtn');
        const sb = document.getElementById('dashSidebar');
        const ov = document.getElementById('sidebarOverlay');
        if (hb) hb.addEventListener('click', () => { sb.classList.toggle('open'); ov.classList.toggle('visible'); });
        if (ov) ov.addEventListener('click', () => { sb.classList.remove('open'); ov.classList.remove('visible'); });
    </script>
</body>
</html>
