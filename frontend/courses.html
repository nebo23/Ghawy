<body>

    <!-- Shared navbar + drawer — single source in src/js/layout.js -->
    <div id="siteHeader"></div>
    <script src="src/js/layout.js?v=20260804"></script>

    <main class="page-shell">
        <div class="container">
            <header class="page-shell-head">
                <h1 class="page-shell-title" data-ar="الكورسات" data-en="Courses">الكورسات</h1>
                <p class="page-shell-lead" data-ar="كل كورسات الـ AI في مكان واحد — من الأساسيات لأحدث التطورات، وبتتحدّث باستمرار." data-en="Every AI course in one place — from the fundamentals to the latest developments, updated continuously.">كل كورسات الـ AI في مكان واحد — من الأساسيات لأحدث التطورات، وبتتحدّث باستمرار.</p>
            </header>

            <!-- Totals across the whole catalog — summed from catalog.js, not
                 typed in here, so they follow the platform. -->
            <div class="courses-info-bar is-pending" id="coursesTotals">
                <div class="info-item">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span><span data-ar="إجمالي الكورسات:" data-en="Total courses:">إجمالي الكورسات:</span>
                        <strong data-total="courses">—</strong></span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span><span data-ar="إجمالي الساعات:" data-en="Total hours:">إجمالي الساعات:</span>
                        <strong data-total="hours">—</strong></span>
                </div>
            </div>

            <!-- The exact same card component the home page uses — one
                 renderer in catalog.js, never a second copy. Skeleton →
                 cards → empty state are all handled there. -->
            <div class="gc-grid" id="coursesGrid"></div>
        </div>
    </main>

    <!-- Shared footer — single source in src/js/layout.js -->
    <div id="siteFooter"></div>
    <script>GhawyLayout.mountFooter();</script>

    <script src="src/js/i18n.js?v=20260805a"></script>
    <!-- The single source for course + instructor data. It renders
         #coursesGrid and #coursesTotals above on its own. -->
    <script src="src/js/catalog.js?v=20260805a"></script>
    <script src="src/js/utils.js?v=20260804"></script>
</body>

</html>
