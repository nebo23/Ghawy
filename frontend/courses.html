<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- CACHE BUSTER -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Courses — Ghawy</title>
    <meta name="description" content="Browse all available courses on Ghawy"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="icon" type="image/png" href="./imgs/ghawi-logo.png"/>
    <link rel="stylesheet" href="src/css/dashboard.css"/>
    
</head>
<body>
<div class="dash-layout">
    <!-- SIDEBAR -->
    <aside class="dash-sidebar" id="dashSidebar">
        <div class="sidebar-logo"><img src="./imgs/ghawi-logo.png" alt="Ghawy"/><span>Ghawy</span></div>
        <nav class="sidebar-nav">
            <a href="dashboard.html?v=2" class="nav-item"><i data-lucide="layout-grid" class="nav-icon"></i> <span data-i18n="dashboard">الرئيسية</span></a>
            <a href="courses.html?v=2" class="nav-item active"><i data-lucide="presentation" class="nav-icon"></i> <span data-i18n="courses">الكورسات</span></a>
            <a href="build-with-me.html" class="nav-item"><i data-lucide="play-circle" class="nav-icon"></i> <span data-i18n="buildWithMe">???? ????? (????)</span></a>
            <a href="guest-of-honors.html?v=2" class="nav-item"><i data-lucide="star" class="nav-icon"></i> <span data-i18n="guestOfHonors">ضيوف الشرف</span></a>
            <a href="chat.html?v=5" class="nav-item"><i data-lucide="message-circle" class="nav-icon"></i> <span data-i18n="communityChat">شات المجتمع</span></a>
            
            <a href="chat.html?v=5&channel=messages" class="nav-item"><i data-lucide="mail" class="nav-icon"></i> <span>Direct Messages</span> <span id="dmTotalBadge" class="dm-unread-badge" style="display:none; margin-left:auto; margin-right:4px;"></span></a>

            <a href="profile.html#achievements" class="nav-item"><i data-lucide="trophy" class="nav-icon"></i> <span data-i18n="achievements">الإنجازات</span></a>
            <a href="profile-settings.html" class="nav-item"><i data-lucide="settings" class="nav-icon"></i> <span data-i18n="settings">الإعدادات</span></a>
            <a href="teamdashboard.html?v=2" class="nav-item" data-admin-only="true"><i data-lucide="users" class="nav-icon"></i> <span data-i18n='teamDashboard'>Team Dashboard</span></a>
        </nav>
        <div class="sidebar-user" id="sidebarUser">
            <div class="sidebar-user-avatar" id="sidebarAvatar"><i data-lucide="user" style="width:16px;height:16px;"></i></div>
            <div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebarName">—</div><div class="sidebar-user-badge" id="sidebarBadge" data-i18n="member">عضو</div></div>
        </div>
        <div class="sidebar-streak"><span class="streak-fire">🔥</span><span><span class="streak-count" id="streakCount">0</span> <span data-i18n="daysStreak">يوم متواصل</span></span></div>
    </aside>
    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dash-main">
        <!-- TOPBAR -->
        <header class="dash-topbar">
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
            <div class="topbar-search"><i data-lucide="search" size="16"></i><input type="text" data-i18n-placeholder="searchCourses" placeholder="ابحث في الكورسات..."/><kbd>⌘K</kbd></div>
            <div class="topbar-actions">

                <div class="notif-wrapper" id="notifWrapper">
                    <button class="topbar-icon" id="notifBellBtn" onclick="toggleNotifPanel()" title="Notifications"><i data-lucide="bell" size="18"></i><span class="notif-dot" id="notifDot" style="display:none;"></span><span class="notif-badge" id="notifBadge" style="display:none;">0</span></button>
                    <div class="notif-panel" id="notifPanel">
                        <div class="notif-panel-header">
                            <h4>Notifications</h4>
                            <button class="notif-close-btn" onclick="toggleNotifPanel()"><i data-lucide="x" size="16"></i></button>
                        </div>
                        <div class="notif-panel-list" id="notifList">
                            <div class="notif-empty">No notifications</div>
                        </div>
                    </div>
                </div>
                <a href="chat.html?v=5" class="topbar-icon"><i class="fa-solid fa-message"></i></a>
                <div class="topbar-user" id="topbarUser" onclick="document.getElementById('userDropdown').classList.toggle('open')">
                    <div class="topbar-user-avatar" id="topbarAvatar"><i data-lucide="user" style="width:16px;height:16px;"></i></div>
                    <span class="topbar-user-name" id="topbarName">—</span>
                    <i data-lucide="chevron-down" style="width:14px;height:14px;"></i>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <a href="profile.html"><i data-lucide="user" style="width:16px;height:16px;"></i> <span data-i18n="profile">الملف الشخصي</span></a>
                    <a href="profile-settings.html"><i data-lucide="settings" class="nav-icon"></i> <span data-i18n="settings">الإعدادات</span></a>
                    <button class="dd-danger" onclick="logout()"><i data-lucide="log-out" style="width:16px;height:16px;"></i> <span data-i18n="logout">تسجيل الخروج</span></button>
                </div>
            </div>
        </header>

        <div class="dash-content">
            <div class="breadcrumb">
                <a href="dashboard.html?v=2"><i data-lucide="layout-grid" class="nav-icon"></i></a>
                <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
                <span data-i18n="courses">الكورسات</span>
            </div>
            <div class="card-header"><h2 class="card-title" style="font-size:1.3rem" data-i18n="allCourses">جميع الكورسات</h2></div>
            <div class="courses-grid" id="coursesGrid">
                <div class="empty-state" id="coursesLoading"><div class="spinner-ring" style="width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite"></div><p>Loading courses...</p></div>
            </div>
            <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
        </div>
    </div>
</div>
<script>document.addEventListener('click',e=>{const d=document.getElementById('userDropdown');const u=document.getElementById('topbarUser');if(d&&!d.contains(e.target)&&!u.contains(e.target))d.classList.remove('open')})</script>
<script src="src/js/utils.js"></script>
<script src="src/js/i18n.js"></script>
<script src="src/js/courses.js"></script>


<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" onload="lucide.createIcons()"></script>
</body>
</html>
