<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <!-- CACHE BUSTER -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — Ghawy</title>
  <link rel="icon" type="image/png" href="./imgs/community-logo.png">
  <link rel="stylesheet" href="src/css/style.css">

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>

<body>
  <!-- Back Button -->
  <a href="index.html"
    style="position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; font-family: Cairo, sans-serif; font-size: 0.95rem; font-weight: 700; z-index: 20; background: #1a1a1a; padding: 8px 16px; border-radius: 20px; transition: all 0.3s;"
    onmouseover="this.style.background='#c1ff11'; this.style.color='#000';"
    onmouseout="this.style.background='#1a1a1a'; this.style.color='#fff';">
    <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> رجوع
  </a>

  <!-- Logo -->
  <div
    style="display: flex; justify-content: center; margin-bottom: 8px; position: relative; width: 100%; max-width: 440px; z-index: 10;">
    <img src="./imgs/g-icon-logo.png" alt="Ghawy Logo" style="height: 8rem; object-fit: contain;">
  </div>

  <div class="card cyan">
    <h1 class="card-title" data-i18n="loginTitle">تسجيل <span class="cyan">الدخول</span></h1>
    <div id="alert" class="alert"></div>
    <div class="field">
      <label data-i18n="email">البريد الإلكتروني</label>
      <input type="email" id="email" data-i18n-placeholder="emailPlaceholder" placeholder="example@gmail.com" dir="ltr"
        class="cyan-focus" />
    </div>
    <div class="field">
      <label data-i18n="currentPassword">كلمة المرور</label>
      <div style="position: relative;">
        <input type="password" id="password" data-i18n-placeholder="passwordPlaceholder" placeholder="••••••••"
          dir="ltr" class="cyan-focus" style="padding-left: 40px; width: 100%; box-sizing: border-box;" />
        <button type="button" onclick="togglePassword()"
          style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;"
          tabindex="-1" title="عرض كلمة المرور">
          <span id="toggleIconContainer" style="display: flex; align-items: center; justify-content: center;"><i
              data-lucide="eye" style="width: 20px; height: 20px;"></i></span>
        </button>
      </div>
    </div>
    <button class="btn" id="loginBtn" onclick="login()">
      <span class="btn-text" data-i18n="enterBtn">دخول</span>
      <div class="spinner"></div>
    </button>

    <!-- Divider -->
    <div style="display: flex; align-items: center; margin: 24px 0;">
      <div style="flex-grow: 1; border-top: 1px solid #333;"></div>
      <span style="padding: 0 16px; font-size: 14px; color: #888; font-weight: bold;" data-i18n="orDivider">أو</span>
      <div style="flex-grow: 1; border-top: 1px solid #333;"></div>
    </div>

    <!-- Google Button -->
    <button type="button" onclick="window.location.href=`${API}/auth/google/login`"
      style="width: 100%; background-color: transparent; border: 1px solid #333; color: #fff; font-weight: bold; padding: 12px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 12px; transition: background-color 0.2s;"
      onmouseover="this.style.backgroundColor='#1a1a1a'" onmouseout="this.style.backgroundColor='transparent'">
      <svg style="width: 22px; height: 22px;" viewBox="0 0 24 24">
        <path fill="#4285F4"
          d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
        <path fill="#34A853"
          d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
        <path fill="#FBBC05"
          d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
        <path fill="#EA4335"
          d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
      </svg>
      <span data-i18n="googleLogin">الدخول باستخدام جوجل</span>
    </button>

    <div class="bottom-link" style="margin-top: 24px;">
      <span data-i18n="dontHaveAccount">مش عندك حساب؟</span> <a href="register.html" data-i18n="registerNow">سجّل
        دلوقتي</a>
    </div>
  </div>

  <script src="src/js/utils.js?v=10"></script>
  <script src="src/js/i18n.js"></script>
  <script>
    // Login page is always English — block localStorage write so user preference on other pages is preserved
    (function() {
      const _orig = localStorage.setItem.bind(localStorage);
      localStorage.setItem = function(k, v) { if (k !== 'ghawy_lang') _orig(k, v); };
      applyLanguage('en');
      localStorage.setItem = _orig;
    })();
  </script>
  <script src="src/js/login.js?v=2"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const iconContainer = document.getElementById('toggleIconContainer');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        iconContainer.innerHTML = '<i data-lucide="eye-off" style="width: 20px; height: 20px;"></i>';
      } else {
        passwordInput.type = 'password';
        iconContainer.innerHTML = '<i data-lucide="eye" style="width: 20px; height: 20px;"></i>';
      }
      lucide.createIcons();
    }
  </script>
</body>

</html>
