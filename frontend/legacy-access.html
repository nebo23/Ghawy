<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <!-- CACHE BUSTER -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض الأعضاء القدامى — Ghawy</title>
  <meta name="description"
    content="إذا كنت عضواً في كورس Ghawy القديم، تحقق من أهليتك للحصول على شهر مجاني على المنصة الجديدة.">
  <link rel="icon" type="image/png" href="./imgs/community-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/style.css">

  <style>
    :root {
      --primary: #3f8ff9;
      --primary-dim: rgba(63, 143, 249, 0.12);
      --primary-border: rgba(63, 143, 249, 0.3);
      --bg: #090912;
      --bg-card: #0f1117;
      --border: #1e2130;
      --text: #f0f4ff;
      --text-muted: #8892a4;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Cairo', sans-serif;
      color: var(--text);
      padding: 16px 12px;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Background ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(63, 143, 249, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Card ── */
    .legacy-card {
      position: relative;
      z-index: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(63, 143, 249, 0.05);
    }

    /* ── Whop hint ── */
    .whop-hint {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin-top: 7px;
      background: rgba(63, 143, 249, 0.07);
      border: 1px solid rgba(63, 143, 249, 0.18);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
      color: #7ab8ff;
      line-height: 1.5;
    }
    .whop-hint svg {
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      body {
        justify-content: flex-start;
        padding-top: 24px;
        padding-bottom: 24px;
      }
      .legacy-card {
        padding: 24px 16px;
        border-radius: 14px;
      }
      .card-heading { font-size: 1.25rem; }
      .logo-wrap img { height: 58px; }
      .otp-grid input {
        width: 40px;
        height: 50px;
        font-size: 1.2rem;
      }
      .btn-primary { font-size: 0.95rem; padding: 12px; }
    }
    @media (max-width: 360px) {
      .legacy-card { padding: 20px 12px; }
      .otp-grid { gap: 6px; }
      .otp-grid input { width: 36px; height: 46px; font-size: 1.1rem; }
    }

    /* ── Logo ── */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-wrap img {
      height: 72px;
      object-fit: contain;
    }

    /* ── Headings ── */
    .card-heading {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text);
    }

    .card-subtext {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* ── Form fields ── */
    .field-group {
      margin-bottom: 18px;
    }

    .field-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .field-group input[type="email"],
    .field-group input[type="text"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .field-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(63, 143, 249, 0.12);
    }

    /* ── Primary button ── */
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2a75e0;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(63, 143, 249, 0.35);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary .spinner-inner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-primary.loading .spinner-inner {
      display: block;
    }

    .btn-primary.loading .btn-label {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── OTP grid ── */
    .otp-info {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .otp-info span {
      color: var(--primary);
      font-weight: 700;
    }

    .otp-grid {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
      direction: ltr;
    }

    .otp-grid input {
      width: 48px;
      height: 56px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: 'Cairo', monospace;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      caret-color: var(--primary);
    }

    .otp-grid input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(63, 143, 249, 0.15);
      transform: scale(1.06);
    }

    .otp-grid input.filled {
      border-color: rgba(63, 143, 249, 0.5);
      background: var(--primary-dim);
    }

    /* ── Resend ── */
    .resend-row {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .resend-row button {
      background: none;
      border: none;
      color: var(--primary);
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0;
      text-decoration: underline;
    }

    .resend-row button:disabled {
      color: var(--text-muted);
      text-decoration: none;
      cursor: default;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── Badge ── */
    .promo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(63, 143, 249, 0.15), rgba(100, 200, 255, 0.08));
      border: 1px solid var(--primary-border);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0 auto 20px;
    }

    .badge-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
    }

    /* ── Toast override ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      z-index: 9999;
      animation: fadeup 0.3s ease;
      max-width: 90vw;
      text-align: center;
    }

    .toast.success {
      background: #1a3d2b;
      border: 1px solid #2d6b46;
      color: #4cde80;
    }

    .toast.error {
      background: #3d1a1a;
      border: 1px solid #6b2d2d;
      color: #ff7070;
    }

    .toast.info {
      background: #1a2a3d;
      border: 1px solid #2d4a6b;
      color: #7ab8ff;
    }

    @keyframes fadeup {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* ── Steps ── */
    #stepOtp {
      display: none;
    }

    /* ── Success state ── */
    .success-state {
      text-align: center;
      padding: 12px 0;
      display: none;
    }

    .success-state .check-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
    }

    .success-state h3 {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .success-state p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="legacy-card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="./imgs/g-icon-logo.png" alt="Ghawy" onerror="this.style.display='none'">
    </div>

    <!-- ══════════ STEP 1: EMAIL & DETAILS ══════════ -->
    <div id="stepEmail">
      <div class="badge-wrap">
        <div class="promo-badge">🎁 عرض حصري للأعضاء القدامى</div>
      </div>
      <h1 class="card-heading">أهلاً بك 👋</h1>
      <p class="card-subtext">
        أدخل بياناتك للتحقق من أهليتك للحصول على شهر مجاني على منصة Ghawy
      </p>

      <div class="field-group">
        <label for="nameInput">الاسم بالكامل</label>
        <input type="text" id="nameInput" placeholder="محمد أحمد" autocomplete="name" />
      </div>

      <div class="field-group">
        <label for="emailInput">البريد الإلكتروني</label>
        <input type="email" id="emailInput" placeholder="example@gmail.com" dir="ltr" autocomplete="email" />
        <div class="whop-hint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          تأكد من أن الإيميل هو الذي سجلت به في Whop
        </div>
      </div>

      <div class="field-group">
        <label for="passwordInput">كلمة المرور الجديدة</label>
        <input type="password" id="passwordInput" placeholder="••••••••" dir="ltr" />
      </div>

      <button class="btn-primary" id="sendOtpBtn" onclick="sendOtp()">
        <span class="btn-label">إرسال كود التحقق</span>
        <div class="spinner-inner"></div>
      </button>
    </div>

    <!-- ══════════ STEP 2: OTP ══════════ -->
    <div id="stepOtp">
      <h2 class="card-heading" style="margin-bottom:10px;">أدخل كود التحقق</h2>
      <p class="otp-info">
        تم إرسال كود مكوّن من 6 أرقام إلى<br>
        <span id="emailDisplay"></span>
      </p>

      <div class="otp-grid" id="otpGrid">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell" id="otp0" aria-label="رقم 1">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell" id="otp1" aria-label="رقم 2">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell" id="otp2" aria-label="رقم 3">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell" id="otp3" aria-label="رقم 4">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell" id="otp4" aria-label="رقم 5">
        <input type="text" inputmode="numeric" maxlength="1" class="otp-cell" id="otp5" aria-label="رقم 6">
      </div>

      <button class="btn-primary" id="verifyOtpBtn" onclick="verifyOtp()">
        <span class="btn-label">تأكيد الكود</span>
        <div class="spinner-inner"></div>
      </button>

      <div class="resend-row">
        <span id="resendText">لم يصلك الكود؟ إعادة الإرسال بعد </span>
        <span id="countdown">60</span>
        <span id="resendSuffix"> ثانية</span>
        <button id="resendBtn" onclick="resendOtp()" disabled style="display:none;">إعادة الإرسال</button>
      </div>
    </div>

    <!-- ══════════ SUCCESS ══════════ -->
    <div class="success-state" id="successState">
      <span class="check-icon">🎉</span>
      <h3>تم التحقق بنجاح!</h3>
      <p>جاري تحويلك لإكمال ملفك الشخصي…</p>
    </div>

  </div><!-- /.legacy-card -->

  <script src="src/js/utils.js?v=1785600000"></script>

  <script>
    // ── Config ─────────────────────────────────────────────────────────────
    const LEGACY_API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://127.0.0.1:8000/api/legacy'
      : '/api/legacy';

    let currentEmail = '';
    let currentName = '';
    let currentPassword = '';
    let countdownTimer = null;

    // ── Helpers ──────────────────────────────────────────────────────────────
    function setBtnLoading(id, loading) {
      const btn = document.getElementById(id);
      btn.disabled = loading;
      btn.classList.toggle('loading', loading);
    }

    // ── Step 1: Send OTP ───────────────────────────────────────────────────
    async function sendOtp() {
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!name) {
        showToast('يرجى إدخال الاسم بالكامل', 'error');
        return;
      }
      if (!email || !email.includes('@')) {
        showToast('يرجى إدخال بريد إلكتروني صحيح', 'error');
        return;
      }
      if (!password || password.length < 6) {
        showToast('يجب ألا تقل كلمة المرور عن 6 أحرف', 'error');
        return;
      }

      setBtnLoading('sendOtpBtn', true);
      try {
        const res = await fetch(`${LEGACY_API}/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (res.status === 404) {
          showToast('هذا البريد غير مؤهل للعرض', 'error');
          return;
        }
        if (res.status === 409) {
          showToast('لقد استفدت بالفعل من هذا العرض', 'error');
          return;
        }
        if (!res.ok) {
          showToast(data.detail || 'حدث خطأ، يرجى المحاولة مجدداً', 'error');
          return;
        }

        currentEmail = email;
        currentName = name;
        currentPassword = password;
        document.getElementById('emailDisplay').textContent = email;

        // Switch to step 2
        document.getElementById('stepEmail').style.display = 'none';
        document.getElementById('stepOtp').style.display = 'block';

        // Auto-focus first OTP cell
        document.getElementById('otp0').focus();

        // Start countdown
        startCountdown();

        showToast(data.message || 'تم إرسال الكود', 'success');

      } catch (e) {
        showToast('لا يوجد اتصال بالسيرفر', 'error');
      } finally {
        setBtnLoading('sendOtpBtn', false);
      }
    }

    // ── Step 2: Verify OTP ─────────────────────────────────────────────────
    async function verifyOtp() {
      const cells = document.querySelectorAll('.otp-cell');
      const otp = Array.from(cells).map(c => c.value).join('');

      if (otp.length < 6) {
        showToast('يرجى إدخال الكود كاملاً (6 أرقام)', 'error');
        return;
      }

      setBtnLoading('verifyOtpBtn', true);
      try {
        const res = await fetch(`${LEGACY_API}/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: currentEmail,
            otp: otp,
            full_name: currentName,
            password: currentPassword
          })
        });
        const data = await res.json();

        if (!res.ok) {
          showToast(data.detail || 'الكود غير صحيح أو انتهت صلاحيته', 'error');
          // Clear OTP cells
          cells.forEach(c => { c.value = ''; c.classList.remove('filled'); });
          document.getElementById('otp0').focus();
          return;
        }

        // ✅ Success — save token, show success, redirect
        const token = data.access_token || data.token;
        saveToken(token);
        if (data.user) localStorage.setItem('user', JSON.stringify(data.user));

        if (countdownTimer) clearInterval(countdownTimer);

        // Show success state
        document.getElementById('stepOtp').style.display = 'none';
        document.getElementById('successState').style.display = 'block';

        setTimeout(() => {
          window.location.href = data.redirect || 'onboarding.html';
        }, 1500);

      } catch (e) {
        showToast('لا يوجد اتصال بالسيرفر', 'error');
      } finally {
        setBtnLoading('verifyOtpBtn', false);
      }
    }

    // ── Resend OTP ─────────────────────────────────────────────────────────
    async function resendOtp() {
      document.getElementById('resendBtn').style.display = 'none';
      document.getElementById('resendText').style.display = '';
      document.getElementById('countdown').style.display = '';
      document.getElementById('resendSuffix').style.display = '';

      try {
        const res = await fetch(`${LEGACY_API}/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail })
        });
        const data = await res.json();
        if (res.ok) {
          showToast('تم إعادة إرسال الكود', 'success');
          startCountdown();
          // Clear old OTP cells
          document.querySelectorAll('.otp-cell').forEach(c => {
            c.value = '';
            c.classList.remove('filled');
          });
          document.getElementById('otp0').focus();
        } else {
          showToast(data.detail || 'فشل إعادة الإرسال', 'error');
        }
      } catch {
        showToast('لا يوجد اتصال بالسيرفر', 'error');
      }
    }

    // ── Countdown ──────────────────────────────────────────────────────────
    function startCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      let seconds = 60;
      const countdownEl = document.getElementById('countdown');
      const resendBtn = document.getElementById('resendBtn');
      const resendText = document.getElementById('resendText');
      const resendSuffix = document.getElementById('resendSuffix');

      countdownEl.textContent = seconds;
      resendBtn.style.display = 'none';
      resendText.style.display = '';
      countdownEl.style.display = '';
      resendSuffix.style.display = '';

      countdownTimer = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(countdownTimer);
          resendText.style.display = 'none';
          countdownEl.style.display = 'none';
          resendSuffix.style.display = 'none';
          resendBtn.style.display = 'inline';
          resendBtn.disabled = false;
        }
      }, 1000);
    }

    // ── OTP cell navigation ────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      const cells = document.querySelectorAll('.otp-cell');

      cells.forEach((cell, index) => {
        cell.addEventListener('input', (e) => {
          // Keep only digit
          cell.value = cell.value.replace(/\D/g, '').slice(-1);
          cell.classList.toggle('filled', cell.value !== '');

          if (cell.value && index < cells.length - 1) {
            cells[index + 1].focus();
          }
          // Auto-submit when last cell is filled
          if (index === cells.length - 1 && cell.value) {
            const otp = Array.from(cells).map(c => c.value).join('');
            if (otp.length === 6) verifyOtp();
          }
        });

        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !cell.value && index > 0) {
            cells[index - 1].focus();
            cells[index - 1].value = '';
            cells[index - 1].classList.remove('filled');
          }
          if (e.key === 'ArrowLeft' && index < cells.length - 1) cells[index + 1].focus();
          if (e.key === 'ArrowRight' && index > 0) cells[index - 1].focus();
        });

        // Handle paste
        cell.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
          pasted.split('').forEach((char, i) => {
            if (cells[i]) {
              cells[i].value = char;
              cells[i].classList.add('filled');
            }
          });
          if (pasted.length > 0) cells[Math.min(pasted.length, cells.length - 1)].focus();
          if (pasted.length === 6) verifyOtp();
        });
      });

      // Enter key on email input
      document.getElementById('emailInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendOtp();
      });
    });
  </script>

</body>

</html>
