events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ── Gzip Compression ───────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Rate Limiting ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Upstream Backend ───────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;   # Replace with your domain: e.g. ghawy.com www.ghawy.com

        # ── Security Headers ───────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Upload size limit ──────────────────────────────────
        client_max_body_size 50M;

        # ── Static Frontend ────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Auth endpoints — stricter rate limit ───────────────
        location ~ ^/api/(auth/login|auth/register|auth/verify) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── API Proxy ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── WebSocket Proxy ────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;   # Keep WS alive for 1 hour
            proxy_send_timeout 3600s;
        }

        # ── Uploaded files served by Nginx (faster than FastAPI) ──
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ── SPA Fallback ───────────────────────────────────────
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # ── Block common attack vectors ────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
