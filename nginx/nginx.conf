events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Declare UTF-8 at the HTTP level. Without this the only encoding
    # declaration on a page was its <meta charset>, and HTML only honours that
    # tag inside the first 1024 bytes — on 2026-08-15 a GTM + Meta Pixel block
    # went in at the top of every <head> and pushed the tag to byte 1250-1803,
    # past the limit. Browsers fell back to their locale default, every Arabic
    # string on the site turned to mojibake, and i18n.js — which is nothing but
    # Arabic strings, and was being served with no charset either — took the
    # rendering down with it: no translations, no courses, no members.
    #
    # A header beats the meta tag and does not care where the tag sits, so this
    # is the durable half of the fix. The tag has also been moved back to the
    # top of every <head>; the two together mean neither one alone can break
    # the site again.
    charset utf-8;
    charset_types text/html text/css text/plain text/xml
                  application/javascript application/json image/svg+xml;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;


    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Humans log in a handful of times, not continuously. 30/min absorbs typos
    # and small NATs; the 2026-07-21 scanner did sustained multi-req/s for an hour.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    # Registration is a once-ever action per person, so a single IP has no
    # legitimate reason to hit it repeatedly. Tight per-IP cap (1 per 10s, small
    # burst) crushes account-creation floods regardless of the email domain used,
    # while still tolerating a few real signups from behind a shared NAT.
    limit_req_zone $binary_remote_addr zone=register:10m rate=6r/m;
    # Code/OTP verification + code-resend endpoints: a real user submits a code
    # 1-3 times. 6/min per IP makes 6-digit brute-force (1M combinations)
    # mathematically hopeless while never touching legitimate flows.
    limit_req_zone $binary_remote_addr zone=otp:10m rate=6r/m;
    # Cap concurrent connections per IP (scanner opened dozens in parallel).
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Micro-cache for cheap, identical-for-everyone API responses (online-count)
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=apicache:1m max_size=10m inactive=60s;

    # Member-uploaded files that a browser would *execute* get handed over as
    # downloads instead of being rendered.
    #
    # The upload endpoints take the stored extension straight from the filename
    # the client sends, and the only gate is Content-Type — a request header the
    # same client writes. So a logged-in member can post evil.html as
    # "image/png" and have it land under /uploads/, served from ghawy.ai itself.
    # Anything it runs is same-origin: it can read the auth token out of
    # localStorage and act as whoever opens the link, and the site has a chat to
    # spread that link through. Two .html files are already sitting in
    # uploads/chat (both benign, shared 2026-07-04) — the capability is real,
    # nobody has abused it.
    #
    # Content-Disposition: attachment ends the execution path without taking
    # the files away: the browser saves them instead of rendering them, so no
    # script ever runs on this origin. nginx omits a header whose value is
    # empty, so ordinary images and PDFs pass through untouched and uncached
    # by this rule.
    #
    # This is the containment half. The upload handlers should derive the
    # extension from the validated content type rather than from user input —
    # that fix lives in the backend and needs a rebuild to ship.
    map $uri $upload_disposition {
        default                                                        "";
        "~*^/(api/)?(uploads|static)/.*\.(html?|xhtml|shtml|xml|svg|svgz|js|mjs|css|php\d?|phtml|phar|sh|py|pl|cgi|jsp|asp|aspx|htaccess)$"  "attachment";
    }

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name ghawy.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ghawy.ai;

        ssl_certificate /etc/letsencrypt/live/ghawy.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ghawy.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # TLS session resumption — fewer full handshakes for repeat visitors
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers live in an include: a location that adds any header
        # of its own drops every add_header inherited from here, so each of
        # those locations has to repeat the set. See the file for the details.
        include /etc/nginx/conf.d/security_headers.conf;

        client_max_body_size 50M;
        limit_conn perip 40;

        root /usr/share/nginx/html;
        index index.html;

        # Both rules match against the PATH only — the `[^?]` keeps the regex
        # from crossing into the query string.
        #
        # They used to read `^(/.*)\.html(\?.*)?$`, and `.*` happily ate the `?`
        # along with everything after it. So Google sign-in, which redirects to
        # /auth-complete?next=/dashboard.html, matched: $1 came back as
        # "/auth-complete?next=/dashboard", $is_args$args stuck the original
        # query string on the end again, and the 301 pointed at
        # /auth-complete?next=/dashboard?next=/dashboard.html — which matched
        # once more, and again, until Chrome gave up with ERR_TOO_MANY_REDIRECTS.
        # Only members already past /pricing were sent to a `.html` destination,
        # so signing in with Google was broken for every paying member and
        # working for everyone else.

        # Redirect /index.html to /
        if ($request_uri ~ ^([^?]*)/index\.html($|\?)) {
            return 301 $1/$is_args$args;
        }

        # Remove .html extension from URLs
        if ($request_uri ~ ^(/[^?]*)\.html($|\?)) {
            return 301 $1$is_args$args;
        }

        # /payment was retired and /pricing took its place. Old links live on
        # in sent emails, bookmarks and search results, so the address has to
        # keep resolving rather than start 404ing.
        #
        # Exact match (=), which outranks the static-asset regex below and the
        # filesystem lookup. /payment.html lands here too: the rule above
        # strips .html first, so the chain is /payment.html → /payment →
        # /pricing. The query string is carried through on purpose — the
        # Google-auth redirect arrives with ?token= and Kashier's failure
        # redirect with ?error=failed, and both are read on the far side.
        location = /payment {
            return 301 /pricing$is_args$args;
        }

        # The service-worker kill-switch must never be cached. It exists to
        # retire a stale worker, and the .js rule below would hand it a 7-day
        # cache — leaving the very browsers it is meant to rescue holding the
        # old copy for another week. Exact match (=) so it outranks that regex.
        location = /sw.js {
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
            try_files $uri =404;
        }

        # Static assets — cached aggressively. Bust cache by changing the query string in HTML.
        # Example in HTML: <script src="/src/js/main.js?v=2025-01-15"></script>
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Cache-Control "public, max-age=604800";
            expires 7d;
            try_files $uri =404;
        }

        # ── Per-endpoint rate limits ─────────────────────────────────────
        # These MUST be exact matches (=): the general `location ^~ /api/`
        # below suppresses regex evaluation entirely, so a `location ~` here
        # would be dead config — that exact bug let the 2026-07-21 flood
        # bypass the auth zone and hammer verify endpoints at the loose
        # 30 r/s api rate for over an hour.

        location = /api/auth/register {
            limit_req zone=register burst=4 nodelay;
            include /etc/nginx/conf.d/api_proxy.conf;
        }
        location = /api/auth/login {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/conf.d/api_proxy.conf;
        }
        location = /api/auth/token {
            limit_req zone=auth burst=10 nodelay;
            include /etc/nginx/conf.d/api_proxy.conf;
        }
        location = /api/auth/verify-email {
            limit_req zone=otp burst=4 nodelay;
            include /etc/nginx/conf.d/api_proxy.conf;
        }
        location = /api/auth/resend-verification-code {
            limit_req zone=otp burst=4 nodelay;
            include /etc/nginx/conf.d/api_proxy.conf;
        }

        # PUBLIC upload categories only — avatars, course thumbnails and post
        # images are content the site shows to strangers anyway, so they are
        # served straight off disk (fast, cached 7 days, off the API rate limit).
        #
        # This used to be `location ^~ /api/uploads/` over the whole tree, which
        # handed out lesson PDFs, payment receipts, project submissions and chat
        # attachments to anyone with a filename. Everything not listed here now
        # falls through to `location ^~ /api/` and reaches app.routers.files,
        # which checks who is asking.
        location ^~ /api/uploads/avatars/ {
            alias /app/uploads/avatars/;
            expires 7d;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Disposition $upload_disposition always;
            add_header Cache-Control "public";
        }

        location ^~ /api/uploads/course-thumbnails/ {
            alias /app/uploads/course-thumbnails/;
            expires 7d;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Disposition $upload_disposition always;
            add_header Cache-Control "public";
        }

        location ^~ /api/uploads/posts/ {
            alias /app/uploads/posts/;
            expires 7d;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Disposition $upload_disposition always;
            add_header Cache-Control "public";
        }

        # Anything else under /api/uploads/ is a protected category (or a probe
        # for one). Refuse it here rather than letting it reach a mount that no
        # longer exists — and never let a proxy cache the refusal as a hit.
        location ^~ /api/uploads/ {
            add_header Cache-Control "private, no-store" always;
            return 404;
        }

        # Where the backend sends an authorized file request back to. `internal`
        # means nginx will only ever reach it via X-Accel-Redirect from the
        # backend — a browser asking for this path directly gets 404. So the
        # bytes are served off disk at nginx speed, but only after the backend
        # has said this caller may have this file.
        location ^~ /_protected_uploads/ {
            internal;
            alias /app/uploads/;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Protected uploads: authorized per request by the backend, so nothing
        # in front of it may cache the answer.
        location ^~ /api/files/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            proxy_cache off;
            add_header Cache-Control "private, no-store" always;
        }

        # Same for API + /static/... (avatars) — previously proxied through the
        # backend with no cache headers, so every page re-downloaded them
        location ^~ /api/static/ {
            alias /app/static/;
            expires 7d;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Disposition $upload_disposition always;
            add_header Cache-Control "public";
        }

        # online-count is polled by every open tab and identical for everyone —
        # answer from a 5s micro-cache so the backend sees ~1 req/5s instead of ~13/s
        location = /api/chat/online-count {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            proxy_cache apicache;
            proxy_cache_valid 200 5s;
            proxy_cache_use_stale updating error timeout;
            proxy_ignore_headers Cache-Control Expires;
        }

        location ^~ /api/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Same split as /api/uploads/ above: public categories off disk, every
        # other path 404s here instead of exposing the tree.
        location ^~ /uploads/avatars/ {
            alias /app/uploads/avatars/;
            expires 7d;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Disposition $upload_disposition always;
            add_header Cache-Control "public";
        }

        location ^~ /uploads/course-thumbnails/ {
            alias /app/uploads/course-thumbnails/;
            expires 7d;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Disposition $upload_disposition always;
            add_header Cache-Control "public";
        }

        location ^~ /uploads/posts/ {
            alias /app/uploads/posts/;
            expires 7d;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Disposition $upload_disposition always;
            add_header Cache-Control "public";
        }

        location ^~ /uploads/ {
            add_header Cache-Control "private, no-store" always;
            return 404;
        }

        location ^~ /files/ {
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            proxy_cache off;
            add_header Cache-Control "private, no-store" always;
        }

        location ^~ /static/ {
            alias /app/static/;
            expires 7d;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Disposition $upload_disposition always;
            add_header Cache-Control "public";
        }

        location / {
            # no-cache (NOT no-store): browsers revalidate with ETag/Last-Modified
            # and get a tiny 304 instead of re-downloading the whole page each visit.
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Cache-Control "no-cache, must-revalidate";
            expires off;
            try_files $uri $uri/ $uri.html =404;
        }

        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
