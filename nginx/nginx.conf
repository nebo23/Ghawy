events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;


    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    # Registration is a once-ever action per person, so a single IP has no
    # legitimate reason to hit it repeatedly. Tight per-IP cap (1 per 10s, small
    # burst) crushes account-creation floods regardless of the email domain used,
    # while still tolerating a few real signups from behind a shared NAT.
    limit_req_zone $binary_remote_addr zone=register:10m rate=6r/m;

    # Micro-cache for cheap, identical-for-everyone API responses (online-count)
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=apicache:1m max_size=10m inactive=60s;

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name ghawy.ai;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ghawy.ai;

        ssl_certificate /etc/letsencrypt/live/ghawy.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ghawy.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # TLS session resumption — fewer full handshakes for repeat visitors
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        # CSP in report-only mode first — flip to enforcing after monitoring violations for 1 week.
        # Adjust connect-src and script-src if you add new third-party services.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://payments.kashier.io https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' wss: https://accounts.google.com https://challenges.cloudflare.com; frame-src https://payments.kashier.io https://accounts.google.com https://challenges.cloudflare.com; frame-ancestors 'none';" always;

        client_max_body_size 50M;

        root /usr/share/nginx/html;
        index index.html;

        # Redirect /index.html to /
        if ($request_uri ~ ^(.*)/index\.html(\?.*)?$) {
            return 301 $1/$is_args$args;
        }

        # Remove .html extension from URLs
        if ($request_uri ~ ^(/.*)\.html(\?.*)?$) {
            return 301 $1$is_args$args;
        }

        # Static assets — cached aggressively. Bust cache by changing the query string in HTML.
        # Example in HTML: <script src="/src/js/main.js?v=2025-01-15"></script>
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=604800";
            expires 7d;
            try_files $uri =404;
        }

        # Registration gets its own much tighter per-IP cap (register zone).
        # Exact-match location wins over the regex below, so /api/auth/register
        # is throttled hard while login/verify keep the looser auth limit.
        location = /api/auth/register {
            limit_req zone=register burst=4 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location ~ ^/api/(auth/login|auth/register|auth/verify) {
            limit_req zone=auth burst=5 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # Frontend builds image URLs as API + /uploads/... — serve those files
        # directly from disk instead of proxying them through the backend
        # (fast, cached 7 days, and they no longer count against the API rate limit)
        location ^~ /api/uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Same for API + /static/... (avatars) — previously proxied through the
        # backend with no cache headers, so every page re-downloaded them
        location ^~ /api/static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # online-count is polled by every open tab and identical for everyone —
        # answer from a 5s micro-cache so the backend sees ~1 req/5s instead of ~13/s
        location = /api/chat/online-count {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
            proxy_cache apicache;
            proxy_cache_valid 200 5s;
            proxy_cache_use_stale updating error timeout;
            proxy_ignore_headers Cache-Control Expires;
        }

        location ^~ /api/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location ^~ /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            # no-cache (NOT no-store): browsers revalidate with ETag/Last-Modified
            # and get a tiny 304 instead of re-downloading the whole page each visit.
            add_header Cache-Control "no-cache, must-revalidate";
            expires off;
            try_files $uri $uri/ $uri.html =404;
        }

        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
