# Security headers, in an include so every location can repeat them.
#
# nginx's add_header does not merge across levels: the moment a location adds
# a header of its own, every add_header inherited from the server block is
# dropped. Six locations here set their own Cache-Control, and that silently
# stripped HSTS, X-Frame-Options, Referrer-Policy, Permissions-Policy and the
# CSP from every HTML page and every static asset — only /api/ responses, the
# one branch that adds no header of its own, still carried them. The pages
# that most need clickjacking and transport protection (/login, /pay,
# /dashboard) were the ones going out bare.
#
# Keep this file the single source of truth and include it in any location
# that calls add_header, so the headers survive.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
# CSP in report-only mode first — flip to enforcing after monitoring violations for 1 week.
# Adjust connect-src and script-src if you add new third-party services.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://payments.kashier.io https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' wss: https://accounts.google.com https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://connect.facebook.net https://www.facebook.com https://*.clarity.ms https://c.bing.com; frame-src https://payments.kashier.io https://accounts.google.com https://challenges.cloudflare.com https://www.googletagmanager.com; frame-ancestors 'none';" always;
