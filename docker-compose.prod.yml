

# ═══════════════════════════════════════════════════════════════
#  Ghawy — Production Docker Compose (Hostinger KVM 2)
#  Usage: docker compose -f docker-compose.prod.yml up -d --build
# ═══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ghawy_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"   # localhost-only (SSH tunnel access)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      # internal only. The port publish is already bound to 127.0.0.1, but there
      # was no reason for the database to be reachable from the external network
      # as well — only the backend talks to it, and the backend is on internal.
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── FastAPI Backend (Gunicorn + UvicornWorkers) ─────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghawy_backend
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
      # Protected uploads are authorized by the backend and then handed to nginx
      # to serve off disk (see location ^~ /_protected_uploads/). Unset this and
      # the backend streams them itself, which is the local-dev path.
      X_ACCEL_UPLOADS_PREFIX: /_protected_uploads/
    volumes:
      # Persist uploads outside the container
      - uploads_data:/app/uploads
      - static_data:/app/static
      # Persist email campaign JSON files (dashboard-created campaigns survive rebuilds)
      - campaigns_data:/app/campaigns
    networks:
      - internal
      - external
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Run DB migrations then start Gunicorn
    command: >
      sh -c "
        alembic upgrade head &&
        gunicorn main:app --config gunicorn.conf.py
      "

  # ── Nginx (Reverse Proxy + Static File Server) ──────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ghawy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
      - uploads_data:/app/uploads:ro
      - static_data:/app/static:ro
      # ACME http-01 challenge webroot. nginx has always had a
      # `location /.well-known/acme-challenge/ { root /var/www/certbot; }` but
      # the directory was never mounted, so the location 404'd and certbot was
      # left on the standalone plugin — which needs port 80, the port this
      # container holds. Every renewal since failed with "Could not bind TCP
      # port 80", and the certificate was 14 days from expiry before anyone
      # looked. With this mount certbot renews over webroot, no downtime.
      - /var/www/certbot:/var/www/certbot:ro
      # SSL certificates (real files, not symlinks)
      - /opt/ghawy/ssl/fullchain.pem:/etc/letsencrypt/live/ghawy.ai/fullchain.pem:ro
      - /opt/ghawy/ssl/privkey.pem:/etc/letsencrypt/live/ghawy.ai/privkey.pem:ro
    networks:
      - external
    depends_on:
      backend:
        condition: service_healthy

# ── Networks ────────────────────────────────────────────────────
networks:
  internal:
    # Backend ↔ Postgres only — not exposed to internet
    internal: true
  external:
    # Nginx ↔ Backend ↔ internet

# ── Volumes ─────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  campaigns_data:
    driver: local
  static_data:
    driver: local
