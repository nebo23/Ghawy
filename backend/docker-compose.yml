version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ghawy_user
      POSTGRES_PASSWORD: Nabil.info2007
      POSTGRES_DB: ghawy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: